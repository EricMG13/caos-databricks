# Every gate in docs/rebuild/2026-09-22-caos-databricks-spec.md section 5,
# as one job per toolchain. Installs are locked (`uv sync --locked`) and
# wheels-only (`tool.uv.no-build`), actions are SHA-pinned, and a superseded
# run is cancelled. The gateway smoke (A31) is not here: it needs a workspace
# profile and spends money, so it is run by a deployer (docs/DEPLOYMENT.md).
name: ci
on:
  push:
    branches: [main, rebuild/databricks]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: {version: "0.12.5", enable-cache: true}
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check_vocabulary.py
      - run: uv run python scripts/check_tested.py
      - run: uv run python scripts/io_budget.py --assert
      - run: uv run python scripts/check_gate_config.py
      - run: uv run python scripts/check_icm.py
      - run: uv run python scripts/document_register.py
      - run: uv run complexipy caos scripts icm --max-complexity-allowed 15
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: {version: "0.12.5", enable-cache: true}
      - run: uv sync --locked --all-groups
      - run: uv run mypy caos scripts tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Digest-pinned; a tag alone is not a pin. postgres:17-alpine.
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env: {POSTGRES_PASSWORD: caos, POSTGRES_DB: caos}
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: {version: "0.12.5", enable-cache: true}
      - run: uv sync --locked --all-groups
      - run: uv run pytest -n auto -m "not live_provider"
        env:
          CAOS_TEST_POSTGRES_URL: postgresql://postgres:caos@localhost:5432/caos
          # A store suite that skipped is not a store suite that passed.
          CAOS_REQUIRE_POSTGRES: "1"
      - run: uv run python scripts/scan_floors.py coverage.xml --cobertura
      - run: uv run pytest --no-cov tests/test_postgres_races.py
        env:
          CAOS_TEST_POSTGRES_URL: postgresql://postgres:caos@localhost:5432/caos
          CAOS_REQUIRE_POSTGRES: "1"
      - run: uv run python -B vendor/deploy-v/verify_package.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: {version: "0.12.5", enable-cache: true}
      - run: uv sync --locked --all-groups
      # `|| true` so the floor check, not bandit's exit code, is the verdict:
      # a report that parsed nothing must fail even when it found nothing.
      - run: uv run bandit -r caos scripts icm -f json -o bandit.json || true
      - run: |
          uv run python scripts/scan_floors.py bandit.json --no-parse-errors \
                 --cover caos scripts icm --unscanned tests
      - run: uv run bandit -r caos scripts icm
      # The environment `uv sync --locked` built from the hashed lock is what runs.
      - run: uv run pip-audit --strict
      # The whole history, as gate A12 runs it locally. The action scans only
      # the push's commit range and failed on the first push over git's own
      # stderr while finding nothing; the image is digest-pinned like postgres.
      - run: >-
          docker run --rm -u "$(id -u):$(id -g)"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          git --no-banner .

  bundle:
    # The bundle against the loopback workspace (D28): validate, deploy and
    # run through the real CLI with nothing below HTTP injected. A profile is
    # never needed here; the enterprise deploy is scripts/enterprise_deploy.py.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: {version: "0.12.5", enable-cache: true}
      - uses: databricks/setup-cli@d76f84cea9893ce68311a1f33fb0c95af6c963b7 # v1.17.0
        with: {version: "1.17.0"}
      - run: uv sync --locked --all-groups
      - run: mkdir -p frontend/dist && touch frontend/dist/index.html
      - run: >-
          uv run python tests/workspace_stub.py -- databricks bundle validate -t dev
          --var uc_catalog=main --var uc_schema=caos --var lakebase_instance=caos-lb
      - run: >-
          uv run python tests/workspace_stub.py -- databricks bundle deploy -t dev
          --var uc_catalog=main --var uc_schema=caos --var lakebase_instance=caos-lb
      - run: >-
          uv run python tests/workspace_stub.py -- databricks bundle run caos -t dev
          --var uc_catalog=main --var uc_schema=caos --var lakebase_instance=caos-lb
      # What the deploy synced is what the app needs (F48): the check reads the
      # CLI's own record of the files it uploaded.
      - run: uv run python scripts/check_gate_config.py --shipped .databricks/bundle/dev/deployment.json

  size:
    # AI PRs carry ~1.7x the issues of human PRs, and density rises with size.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - run: python3 scripts/check_pr_size.py "origin/${{ github.base_ref }}"
      # A budget may only fall (F58): the base branch's baseline is the ceiling.
      - run: git show "origin/${{ github.base_ref }}:tests/gate_baseline.json" > "$RUNNER_TEMP/base.json"
      - run: python3 scripts/check_gate_config.py --against "$RUNNER_TEMP/base.json"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: nine section routes in the export
        run: |
          for s in directory upload analysis book run model report committee admin; do
            test -f "dist/$s/index.html" || { echo "missing dist/$s/index.html"; exit 1; }
          done
      - run: npm run build:demo
      - run: npx --no-install jscpd --threshold 3 --min-lines 10 --ignore "**/node_modules/**,**/dist/**,**/dist-demo/**" ../caos ../scripts ../icm src
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}
      - run: ./node_modules/.bin/playwright install --with-deps
      - run: npm run a11y
      - run: npm run test:workbench
