# gitleaks' default rules, plus one exemption.
#
# The closed provider finish reasons below are public enum values rather than
# credentials. Nothing else is allowlisted: every identifier this repository
# tracks is public, and the credentials it uses (the app's service principal,
# Lakebase credentials minted per connection, a test-only OpenRouter key read
# from the environment) appear in no tracked file.
[extend]
useDefault = true

[allowlist]
description = "Closed provider finish-reason enums"
regexes = ['''^finish_reason=(?:stop|length)$''']
