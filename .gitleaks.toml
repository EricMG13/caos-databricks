# gitleaks' default rules, plus one exemption.
#
# The closed provider finish reasons below are public enum values rather than
# credentials. Nothing else is allowlisted: every identifier this repository
# tracks is public, and the credentials it uses (the app's service principal,
# Lakebase credentials minted per connection, a test-only OpenRouter key read
# from the environment) appear in no tracked file.
[extend]
useDefault = true

[allowlist]
description = "Closed provider finish-reason enums, and SHA-256 digests"
# A bare 64-hex string is a content digest here: the parity manifests, the
# host records and the bundle manifests are made of them, and no credential
# this repository could hold has that shape (a token carries its prefix, which
# this expression does not admit).
regexes = ['''^finish_reason=(?:stop|length)$''', '''^[0-9a-f]{64}$''']
